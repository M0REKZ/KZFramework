plugins {
     id 'com.android.application'
}

// https://wiki.libsdl.org/SDL3/README-android
def buildWithCMake = true; //project.hasProperty('BUILD_WITH_CMAKE');

// +KZ for game path
def KZFrameworkGameDir = project.findProperty("KZFRAMEWORK_GAME_DIR");
def KZFrameworkAppIdentifier = project.findProperty("KZFRAMEWORK_IDENTIFIER");
def KZFrameworkAppName = project.findProperty("KZFRAMEWORK_APP_NAME")
def KZFrameworkAppIcon = project.findProperty("KZFRAMEWORK_APP_ICON")
def KZFrameworkAppIconBackground = project.findProperty("KZFRAMEWORK_APP_ICON_BACKGROUND") ?: "#FFFFFF"

if (!KZFrameworkGameDir)
{
    throw new GradleException("Need to specify game directory in KZFRAMEWORK_GAME_DIR")
}

if (!KZFrameworkAppIdentifier)
{
    throw new GradleException("Need to specify app identifier in KZFRAMEWORK_IDENTIFIER")
}

if (!KZFrameworkAppName)
{
    throw new GradleException("Need to specify app name in KZFRAMEWORK_APP_NAME")
}

if (KZFrameworkAppIcon) {
    def iconFile = file(KZFrameworkAppIcon)

    if (!iconFile.isFile()) {
        throw new GradleException("Custom icon not found: ${iconFile}")
    }

    def generatedResDir = file("$buildDir/generated/custom-res")

    def generateCustomIcon = tasks.register("generateCustomIcon") {
        doLast {
            def drawableDir = file("$generatedResDir/drawable")
            def mipmapDir = file("$generatedResDir/mipmap-anydpi-v26")
            def valuesDir = file("$generatedResDir/values")

            drawableDir.mkdirs()
            mipmapDir.mkdirs()
            valuesDir.mkdirs()

            copy {
                from(iconFile)
                into(drawableDir)
                rename { "ic_launcher_foreground.png" }
            }

            file("$valuesDir/colors.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">${KZFrameworkAppIconBackground}</color>
</resources>
"""

            file("$mipmapDir/ic_launcher.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
"""

            file("$mipmapDir/ic_launcher_round.xml").text = """<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background" />
    <foreground android:drawable="@drawable/ic_launcher_foreground" />
</adaptive-icon>
"""
        }
    }

    tasks.named("preBuild") {
        dependsOn(generateCustomIcon)
    }
}
else
{
    throw new GradleException("Need to specify a icon with KZFRAMEWORK_APP_ICON")
}

android {
    namespace = "io.m0rekz.github.kzframework"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {

        //+KZ too
        applicationId "${KZFrameworkAppIdentifier}"
        resValue "string", "app_name", "${KZFrameworkAppName}"

        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            assets.srcDirs = ["${KZFrameworkGameDir}"]
            res.srcDirs += "$buildDir/generated/custom-res"
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
