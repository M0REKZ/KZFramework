plugins {
     id 'com.android.application'
}

// https://wiki.libsdl.org/SDL3/README-android
def buildWithCMake = true; //project.hasProperty('BUILD_WITH_CMAKE');

// +KZ for game path
def KZFrameworkGameDir = project.findProperty("KZFRAMEWORK_GAME_DIR");
def KZFrameworkAppIdentifier = project.findProperty("KZFRAMEWORK_IDENTIFIER");
def KZFrameworkAppName = project.findProperty("KZFRAMEWORK_APP_NAME")

android {
    namespace = "io.m0rekz.github.kzframework"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    defaultConfig {

        //+KZ too
        applicationId "${KZFrameworkAppIdentifier}"
        resValue "string", "app_name", "${KZFrameworkAppName}"

        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
            assets.srcDirs = ["${KZFrameworkGameDir}"]
        }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path '../../CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }
    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
